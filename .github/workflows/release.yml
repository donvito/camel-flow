name: Release

# Push a tag like v0.1.0 to build camelflow.jar and publish it as a GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B -ntp verify -Drevision=${{ steps.version.outputs.version }}

      - name: Check the jar reports the right version
        run: |
          unzip -p target/camelflow.jar META-INF/MANIFEST.MF | grep -q "Implementation-Version: ${{ steps.version.outputs.version }}"
          java -jar target/camelflow.jar --help

      - name: Release notes from CHANGELOG.md
        run: |
          # The section under "## [x.y.z]" up to the next "## [" heading
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: https?:/ { next }   # link definitions at the end of the file
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${{ steps.version.outputs.version }}; using generated notes"
          fi
          cat >> notes.md <<'MD'

          ## Run it

          ```bash
          java -jar camelflow.jar                 # start empty, then open or drop YAML files
          java -jar camelflow.jar ./my-routes     # show a folder and refresh on every save
          jbang camelflow@donvito/camel-flow      # or run it with JBang
          ```

          Requires Java 17 or newer.
          MD

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          GENERATE=""
          if ! grep -q '[^[:space:]]' <(sed '/^## Run it/,$d' notes.md); then GENERATE="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" target/camelflow.jar \
            --title "CamelFlow $VERSION" \
            --notes-file notes.md $GENERATE $PRERELEASE
