name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum the jar supports; 21 is the current LTS most Camel users run
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Builds the React UI (Maven installs its own Node), runs the tests and packages the jar
      - name: Build
        run: mvn -B -ntp verify

      - name: Smoke test the jar
        run: java -jar target/camelflow.jar --help

      - name: Upload jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: camelflow-jar
          path: target/camelflow.jar
          retention-days: 7
